<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>智能投资平台 · 重新连接</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #24354b; font-family: 'Microsoft YaHei', sans-serif; }
    main { width: min(520px, 90vw); padding: 40px; background: #fff; border: 1px solid #dce5ef; border-radius: 16px; }
    small { color: #54708e; } h1 { font-size: 24px; margin: 16px 0; }
    p { color: #63758b; line-height: 1.8; }
    a { display: inline-block; margin-top: 12px; padding: 12px 24px; border-radius: 8px; color: white; background: #2f80ed; text-decoration: none; }
    a:focus-visible { outline: 3px solid #86b7fe; outline-offset: 3px; }
  </style>
</head>
<body><main>
  <small>智能投资平台</small>
  <h1>暂时无法连接服务器</h1>
  <p>请检查网络连接，或稍后再试。你的本地登录信息和会话记录仍会保留。</p>
  <a href="https://www.muyewhisper.cn/">重新连接</a>
  <p><small>也可以按 Ctrl + R 重新连接。</small></p>
</main></body>
</html>
