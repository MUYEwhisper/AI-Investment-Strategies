<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8001 https://www.muyewhisper.cn https://muyewhisper.cn; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>本地智投</title>
  <style>
    :root { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; color: #17283e; background: #e9eef4; font-synthesis: none; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, textarea { font: inherit; }
    button { min-height: 34px; padding: 0 11px; border: 1px solid #c9d7e5; border-radius: 6px; color: #304861; background: #fff; cursor: pointer; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
    button:hover:not(:disabled) { border-color: #77add6; background: #eef7ff; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    button.primary { border-color: #2f76b5; color: #fff; background: #2f76b5; }
    button.primary:hover:not(:disabled) { background: #256397; }
    .shell { display: flex; width: 100%; height: 100%; flex-direction: column; padding: 18px; gap: 14px; opacity: 0; transform: translateY(12px) scale(.99); }
    body.ready .shell { animation: workspace-in .32s cubic-bezier(.2,.7,.2,1) forwards; }
    body.leaving .shell { animation: workspace-out .2s ease-in forwards; pointer-events: none; }
    @keyframes workspace-in { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes workspace-out { to { opacity: 0; transform: translateY(-8px) scale(.995); } }
    .topbar { display: flex; flex: 0 0 66px; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border: 1px solid #d5dee8; border-radius: 8px; background: #fff; }
    .brand { min-width: 0; }
    .brand strong { display: block; color: #1e3852; font-size: 17px; }
    .brand span { display: block; margin-top: 3px; color: #6b7b8f; font-size: 11px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .model-status { padding: 5px 9px; border: 1px solid #c9d7e5; border-radius: 7px; color: #536b83; font-size: 11px; white-space: nowrap; }
    .model-status.ready { border-color: #9bd5b6; color: #27754d; background: #f2fbf5; }
    .model-status.busy { border-color: #9bc8e7; color: #17649c; background: #eef7ff; }
    .model-status.error { border-color: #e2b4b4; color: #a33e3e; background: #fff7f7; }
    .workspace { display: grid; min-height: 0; flex: 1; grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); gap: 12px; }
    .sidebar, .chat { min-width: 0; min-height: 0; border: 1px solid #d5dee8; border-radius: 8px; background: #fff; }
    .sidebar { display: flex; flex-direction: column; overflow: hidden; }
    .sidebar { border-color: #263d56; background: #17283e; color: #eef5fb; }
    .agent-card { margin: 0; padding: 16px 16px 14px; border: 0; border-radius: 0; background: transparent; }
    .agent-card strong { display: block; color: #f2f7fb; font-size: 14px; }
    .agent-card span { display: block; margin-top: 5px; color: #9db1c6; font-size: 11px; line-height: 1.5; }
    .history-head { display: flex; min-height: 48px; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-top: 1px solid rgba(228,239,248,.15); border-bottom: 1px solid rgba(228,239,248,.15); background: transparent; }
    .history-head strong { color: #c5d3e1; font-size: 12px; }
    .history-head button { min-height: 29px; padding: 0 9px; font-size: 11px; }
    .history-list { min-height: 0; flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: #b8c9da transparent; }
    .history-item { display: flex; min-width: 0; align-items: center; gap: 5px; margin-bottom: 5px; padding: 8px; border: 1px solid transparent; border-radius: 6px; color: #c5d3e1; cursor: pointer; animation: history-in .2s ease both; }
    @keyframes history-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .history-item:hover { background: #203952; }
    .history-item.active { border-color: #3e86bf; background: #2a5e8e; color: #fff; }
    .history-meta { min-width: 0; flex: 1; }
    .history-title { overflow: hidden; color: inherit; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .history-time { overflow: hidden; margin-top: 4px; color: #9db1c6; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .history-delete { min-height: 26px; flex: 0 0 auto; padding: 0 6px; border-color: rgba(228,239,248,.18); color: #c5d3e1; background: transparent; font-size: 10px; }
    .history-delete:hover:not(:disabled) { color: #fff; background: #203952; }
    .history-empty { padding: 12px 8px; color: #9db1c6; font-size: 11px; line-height: 1.5; }
    .chat { display: flex; flex-direction: column; overflow: hidden; }
    .chat-toolbar { display: flex; min-height: 46px; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #d5dee8; background: #fff; }
    .chat-toolbar .caption { overflow: hidden; color: #536b83; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .gpu-control { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; color: #48627a; font-size: 11px; white-space: nowrap; }
    .gpu-control input { accent-color: #2f76b5; }
    .messages { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 12px; overflow-y: auto; overscroll-behavior: contain; padding: 20px clamp(14px, 3vw, 34px); background: #f8fafc; scrollbar-width: thin; scrollbar-color: #b8c9da transparent; }
    .message { width: fit-content; max-width: min(94%, 1000px); padding: 11px 14px; border: 1px solid #d5dee8; border-radius: 8px; color: #253d54; background: #fff; font-size: 13px; line-height: 1.75; overflow-wrap: anywhere; word-break: break-word; animation: message-in .2s ease both; }
    .message.user { align-self: flex-end; border-color: #bfd4e6; background: #edf4f9; }
    .message.ai { align-self: flex-start; }
    .message.pending { color: #8492a0; }
    .message.ai p, .message.ai ul, .message.ai ol, .message.ai pre, .message.ai blockquote, .message.ai hr, .message.ai h1, .message.ai h2, .message.ai h3, .message.ai h4, .message.ai h5, .message.ai h6 { margin: 0 0 .72em; }
    .message.ai > :first-child { margin-top: 0; }
    .message.ai > :last-child { margin-bottom: 0; }
    .message.ai h1, .message.ai h2, .message.ai h3, .message.ai h4, .message.ai h5, .message.ai h6 { color: #173354; line-height: 1.35; }
    .message.ai h1 { font-size: 1.28em; }
    .message.ai h2 { font-size: 1.18em; }
    .message.ai h3 { font-size: 1.08em; }
    .message.ai ul, .message.ai ol { padding-left: 1.4em; }
    .message.ai li + li { margin-top: .28em; }
    .message.ai code { padding: .1em .35em; border-radius: 5px; background: #eef4fa; font-family: Consolas, monospace; font-size: .94em; }
    .message.ai pre { overflow-x: auto; padding: .75em .9em; border: 1px solid #d7e5fa; border-radius: 7px; background: #f4f8ff; }
    .message.ai pre code { padding: 0; background: transparent; }
    .message.ai blockquote { padding-left: .9em; border-left: 3px solid #9fc0ef; color: #4b6485; }
    .message.ai a { color: #1363df; text-decoration: none; }
    .message.ai a:hover { text-decoration: underline; }
    .message.ai .md-table-wrap { max-width: 100%; overflow-x: auto; margin: 0 0 .72em; }
    .message.ai table { min-width: 380px; border-collapse: collapse; border: 1px solid #d7e5fa; background: #fff; }
    .message.ai th, .message.ai td { padding: .45em .6em; border: 1px solid #d7e5fa; text-align: left; vertical-align: top; }
    .message.ai th { color: #173354; background: #edf4ff; }
    @keyframes message-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .setup { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-bottom: 1px solid #e5ebf1; background: #f7fafc; }
    .setup[hidden] { display: none; }
    .setup-copy { min-width: 0; flex: 1; color: #6b7b8f; font-size: 11px; line-height: 1.5; }
    .setup-copy strong { display: block; color: #334b63; font-size: 12px; }
    .setup-copy progress { display: block; width: 100%; height: 5px; margin-top: 6px; accent-color: #2f76b5; }
    .setup button { flex: 0 0 auto; }
    .composer-wrap { padding: 12px 14px 8px; border-top: 1px solid #e5ebf1; }
    form { display: flex; align-items: flex-end; gap: 9px; }
    textarea { min-width: 0; min-height: 54px; max-height: 150px; flex: 1; resize: none; padding: 10px 11px; border: 1px solid #ccd9e5; border-radius: 6px; outline: none; color: #253d54; background: #fff; font-size: 13px; line-height: 1.55; }
    textarea:focus { border-color: #5d9bca; box-shadow: 0 0 0 3px rgba(47,118,181,.12); }
    .error { min-height: 0; padding: 0 14px 10px; color: #a33e3e; font-size: 11px; }
    .error:empty { display: none; }
    @media (max-width: 760px) {
      .shell { padding: 10px; gap: 9px; }
      .workspace { grid-template-columns: 190px minmax(0,1fr); gap: 8px; }
      .topbar { min-height: 56px; flex-basis: 56px; padding: 8px 10px; }
      .brand strong { font-size: 14px; }
      .brand span { display: none; }
      .model-status { font-size: 10px; }
      .sidebar { max-height: 100%; }
      .agent-card { margin: 8px; padding: 9px; }
      .history-head { padding: 0 8px; }
      .history-item { padding: 6px; }
      .chat-toolbar { align-items: flex-start; flex-direction: column; gap: 5px; }
      .messages { padding: 14px 10px; }
      .message { max-width: 98%; padding: 9px 10px; font-size: 12px; }
      .setup { align-items: stretch; flex-direction: column; }
    }
    @media (max-width: 540px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(100px, 26%) minmax(0,1fr); }
      .sidebar { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0,1fr); }
      .agent-card { align-self: start; }
      .history-head { grid-column: 2; grid-row: 1; }
      .history-list { grid-column: 2; grid-row: 2; }
      .history-item { margin-bottom: 2px; }
      .history-time { display: none; }
      #back { min-height: 30px; padding: 0 7px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><strong>本地智投</strong><span>DeepSeek-R1-Distill-Qwen-1.5B · 本机推理</span></div>
      <div class="topbar-actions"><span id="status" class="model-status">检查本地模型</span><button id="back" type="button">返回工作台</button></div>
    </header>
    <main class="workspace">
      <aside class="sidebar" aria-label="本地智投会话">
        <div class="agent-card"><strong>智投问答</strong><span>在本机分析投资问题，回答会保存在此设备。</span></div>
        <div class="history-head"><strong>历史对话</strong><button id="newChat" type="button">新建对话</button></div>
        <div id="historyList" class="history-list"></div>
      </aside>
      <section class="chat" aria-label="本地智投聊天">
        <div id="setup" class="setup" hidden>
          <div class="setup-copy"><strong id="setupTitle">本地模型尚未安装</strong><span id="setupMessage">点击后从 ModelScope 下载并配置本地模型。</span><progress id="installProgress" max="100" value="0" hidden></progress></div>
          <button id="installModel" class="primary" type="button">安装本地模型</button>
        </div>
        <div class="chat-toolbar">
          <span class="caption">本地推理 · 投资数据按需通过 MCP 查询</span>
          <label class="gpu-control" title="启用后模型会优先使用可用的 NVIDIA 显卡。"><input id="gpuToggle" type="checkbox" disabled>GPU 加速 <span id="gpuStatus">检测中</span></label>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div class="composer-wrap"><form id="composer"><textarea id="input" placeholder="输入投资相关问题，Enter 发送，Shift+Enter 换行" aria-label="投资问题"></textarea><button id="send" class="primary" type="submit">发送</button></form></div>
        <div id="error" class="error" role="status"></div>
      </section>
    </main>
  </div>
  <script>
    const SITE = 'https://www.muyewhisper.cn'
    const STORAGE_KEY = 'ai_invest_local_chats'
    const GREETING = '你好，我是本地智投。请提出投资相关问题，我会按“结论、分析依据、风险提示”的结构回答。'
    const OUTPUT_RULES = `你是本地版智投问答，只回答用户提出的投资问题。必须使用中文，并严格按以下结构输出：
### 结论
先给出简洁、客观的结论。
### 分析依据
列出不超过4条与结论直接相关的依据；只使用用户提供或 MCP 明确给出的数据，数据不足时明确说明。
### 风险提示
说明关键不确定性和需要关注的风险，最后写“以上内容仅供参考，不构成投资建议。投资有风险，决策请结合自身情况审慎判断。”
不自我介绍，不重复用户问题，不输出思维过程或<think>标签；不虚构数据，不承诺收益，不给出绝对化买卖指令；回答控制在700字以内。`
    const state = { chats: [], activeId: null, busy: false, stickToBottom: true, model: { installed: false, running: false, downloading: false, progress: 0 }, gpu: { gpuEnabled: false, gpuAvailable: false, gpuActive: false } }
    const $ = (id) => document.getElementById(id)
    const uid = () => `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
    const activeChat = () => state.chats.find((chat) => chat.id === state.activeId)
    const setStatus = (text, kind = '') => { $('status').textContent = text; $('status').className = `model-status ${kind}` }
    const setError = (text = '') => { $('error').textContent = text }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chats)) } catch { setError('本地存储空间不足，当前会话暂未保存。') }
    }
    function safeChats() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
        return Array.isArray(parsed) ? parsed.filter((chat) => chat && typeof chat.id === 'string' && Array.isArray(chat.messages)) : []
      } catch { return [] }
    }
    function createChat(select = true) {
      const chat = { id: uid(), title: '新对话', createdAt: new Date().toLocaleString(), messages: [{ role: 'assistant', content: GREETING }] }
      state.chats.unshift(chat)
      if (select) state.activeId = chat.id
      persist(); renderHistory(); if (select) renderMessages(true)
    }
    function selectChat(id) {
      if (state.busy || state.activeId === id) return
      if (!state.chats.some((chat) => chat.id === id)) return
      state.activeId = id; state.stickToBottom = true; renderHistory(); renderMessages(true)
    }
    function deleteChat(id) {
      if (state.busy) return
      state.chats = state.chats.filter((chat) => chat.id !== id)
      if (state.activeId === id) state.activeId = state.chats[0]?.id || null
      if (!state.activeId) { createChat(); return }
      persist(); renderHistory(); renderMessages(true)
    }
    function renderHistory() {
      const list = $('historyList'); list.replaceChildren()
      if (!state.chats.length) { const empty = document.createElement('div'); empty.className = 'history-empty'; empty.textContent = '暂无历史对话。'; list.append(empty); return }
      for (const chat of state.chats) {
        const row = document.createElement('div'); row.className = `history-item${chat.id === state.activeId ? ' active' : ''}`; row.tabIndex = 0; row.setAttribute('role', 'button'); row.setAttribute('aria-current', chat.id === state.activeId ? 'true' : 'false')
        const meta = document.createElement('div'); meta.className = 'history-meta'
        const title = document.createElement('div'); title.className = 'history-title'; title.textContent = chat.title || '本地智投会话'
        const time = document.createElement('div'); time.className = 'history-time'; time.textContent = chat.createdAt || ''
        meta.append(title, time)
        const remove = document.createElement('button'); remove.className = 'history-delete'; remove.type = 'button'; remove.textContent = '删除'; remove.disabled = state.busy; remove.setAttribute('aria-label', `删除${title.textContent}`); remove.addEventListener('click', (event) => { event.stopPropagation(); deleteChat(chat.id) })
        row.append(meta, remove); row.addEventListener('click', () => selectChat(chat.id)); row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectChat(chat.id) } }); list.append(row)
      }
    }
    function scrollBottom(force = false) { requestAnimationFrame(() => { const panel = $('messages'); if (force || state.stickToBottom) panel.scrollTop = panel.scrollHeight }) }
    function escapeHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    }
    function safeUrl(value) {
      const normalized = String(value).trim()
      return /^(https?:|mailto:)/i.test(normalized) ? escapeHtml(normalized) : null
    }
    function renderInlineMarkdown(value) {
      const code = []
      let html = escapeHtml(value).replace(/`([^`\n]+)`/g, (_, text) => {
        const token = `@@CODE_${code.length}@@`; code.push(`<code>${text}</code>`); return token
      })
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        const safeHref = safeUrl(href); return safeHref ? `<a href="${safeHref}" target="_blank" rel="noreferrer">${label}</a>` : label
      })
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      return html.replace(/@@CODE_(\d+)@@/g, (_, index) => code[Number(index)] || '')
    }
    function renderMarkdownToHtml(source) {
      const lines = String(source || '').replace(/\r\n?/g, '\n').split('\n')
      const blocks = []; let paragraph = []; let listType = ''; let listItems = []; let quote = []; let fence = false; let fenceLines = []
      const flushParagraph = () => { if (paragraph.length) { blocks.push(`<p>${renderInlineMarkdown(paragraph.join('\n')).replace(/\n/g, '<br />')}</p>`); paragraph = [] } }
      const flushList = () => { if (listType && listItems.length) blocks.push(`<${listType}>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</${listType}>`); listType = ''; listItems = [] }
      const flushQuote = () => { if (quote.length) { blocks.push(`<blockquote>${renderMarkdownToHtml(quote.join('\n'))}</blockquote>`); quote = [] } }
      const flushFence = () => { blocks.push(`<pre><code>${escapeHtml(fenceLines.join('\n'))}</code></pre>`); fence = false; fenceLines = [] }
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index] || ''
        if (/^```/.test(line)) { flushParagraph(); flushList(); flushQuote(); if (fence) flushFence(); else { fence = true; fenceLines = [] }; continue }
        if (fence) { fenceLines.push(line); continue }
        if (!line.trim()) { flushParagraph(); flushList(); flushQuote(); continue }
        const quoteMatch = line.match(/^>\s?(.*)$/)
        if (quoteMatch) { flushParagraph(); flushList(); quote.push(quoteMatch[1]); continue }
        flushQuote()
        const heading = line.match(/^(#{1,6})\s+(.*)$/)
        if (heading) { flushParagraph(); flushList(); const level = heading[1].length; blocks.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`); continue }
        if (/^([-*_])(?:\s*\1){2,}\s*$/.test(line)) { flushParagraph(); flushList(); blocks.push('<hr />'); continue }
        const ordered = line.match(/^\d+\.\s+(.*)$/); const unordered = line.match(/^[-*+]\s+(.*)$/)
        if (ordered || unordered) { flushParagraph(); const nextType = ordered ? 'ol' : 'ul'; if (listType && listType !== nextType) flushList(); listType = nextType; listItems.push((ordered || unordered)[1]); continue }
        if (listType && /^\s+/.test(line) && listItems.length) { listItems[listItems.length - 1] += ` ${line.trim()}`; continue }
        flushList(); paragraph.push(line)
      }
      if (fence) flushFence(); flushParagraph(); flushList(); flushQuote(); return blocks.join('')
    }
    function updateMessageNode(node, message, renderMarkdown = false) {
      if (!node) return
      node.className = `message ${message.role === 'user' ? 'user' : 'ai'}${message.pending ? ' pending' : ''}`
      if (renderMarkdown && message.role !== 'user') node.innerHTML = renderMarkdownToHtml(message.content)
      else node.textContent = message.content
    }
    function renderMessages(force = false) {
      const panel = $('messages'); panel.replaceChildren()
      const chat = activeChat()
      let pendingNode = null
      for (const message of chat?.messages || []) {
        const node = document.createElement('div'); updateMessageNode(node, message, !message.pending && message.role !== 'user'); panel.append(node)
        if (message.pending) pendingNode = node
      }
      scrollBottom(force)
      return pendingNode
    }
    function renderModel(next) {
      state.model = { ...state.model, ...next }
      const model = state.model; const unavailable = !model.running
      $('setup').hidden = !unavailable
      $('setupTitle').textContent = model.downloading ? '正在安装本地模型' : model.installed ? '本地模型已安装，服务未运行' : '本地模型尚未安装'
      $('setupMessage').textContent = model.downloading ? (model.message || `正在下载 ${model.progress || 0}%`) : model.installed ? '启动本地推理服务后即可继续对话。' : '模型约 1.12GB，将从 ModelScope 下载并安装到本机。'
      $('installModel').textContent = model.downloading ? '正在安装…' : model.installed ? '启动本地模型' : '安装本地模型'
      $('installModel').disabled = Boolean(model.downloading)
      $('installProgress').hidden = !model.downloading; $('installProgress').value = model.progress || 0
      $('input').disabled = !model.running || state.busy; $('send').disabled = !model.running || state.busy
      if (model.running) setStatus('本机模型就绪', 'ready')
      else if (model.downloading) setStatus('正在安装模型', 'busy')
      else setStatus(model.installed ? '模型服务未运行' : '模型未安装', 'error')
    }
    function renderGpu(settings) {
      state.gpu = { ...state.gpu, ...settings }
      const available = Boolean(state.gpu.gpuAvailable)
      $('gpuToggle').checked = Boolean(state.gpu.gpuEnabled)
      $('gpuToggle').disabled = !available || state.busy
      $('gpuStatus').textContent = !available ? '不可用' : state.gpu.gpuActive ? '运行中' : '未启用'
    }
    async function checkHealth() {
      try {
        const response = await fetch('http://127.0.0.1:8001/health', { signal: AbortSignal.timeout(2500) }); const data = await response.json()
        if (response.ok && data.status === 'ok') { renderModel({ installed: true, running: true }); await loadGpu(); return }
      } catch { /* Desktop IPC supplies install status when no model server is available. */ }
      try { renderModel(await window.aiInvestmentDesktop?.getLocalModelStatus?.() || {}) } catch { renderModel({}); setError('无法读取本地模型状态，请重启桌面客户端后重试。') }
      await loadGpu()
    }
    async function loadGpu() {
      try { const settings = await window.aiInvestmentDesktop?.getLocalModelSettings?.(); if (settings) renderGpu(settings) } catch { renderGpu({ gpuAvailable: false }) }
    }
    async function installModel() {
      setError(''); renderModel({ downloading: true, running: false })
      try {
        const result = await window.aiInvestmentDesktop?.installLocalModel?.()
        if (result?.error) setError(result.error)
        if (result) renderModel(result)
        await checkHealth()
      } catch (error) { setError(error instanceof Error ? error.message : '本地模型安装失败。'); renderModel({ downloading: false, running: false }) }
    }
    async function toggleGpu() {
      $('gpuToggle').disabled = true; $('gpuStatus').textContent = '切换中'
      try {
        const settings = await window.aiInvestmentDesktop?.setLocalModelSettings?.({ gpuEnabled: $('gpuToggle').checked })
        if (settings) renderGpu(settings)
        await checkHealth()
      } catch (error) { setError(error instanceof Error ? error.message : 'GPU 设置切换失败。'); await loadGpu() }
      finally { $('gpuToggle').disabled = !state.gpu.gpuAvailable || state.busy }
    }
    function normalizeAnswer(text) {
      let value = text.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/<\/?think>/gi, '').trim()
      if (!value) value = '当前未生成有效回答。'
      if (!value.includes('### 结论')) value = `### 结论\n${value}`
      if (!value.includes('### 风险提示')) value += '\n\n### 风险提示\n以上内容仅供参考，不构成投资建议。投资有风险，决策请结合自身情况审慎判断。'
      return value.slice(0, 4000)
    }
    async function send(event) {
      event.preventDefault(); const prompt = $('input').value.trim(); if (!prompt || state.busy || !state.model.running) return
      let chat = activeChat(); if (!chat) { createChat(); chat = activeChat() }
      const userMessage = { role: 'user', content: prompt }; const answer = { role: 'assistant', content: '正在生成回复…', pending: true }
      chat.messages.push(userMessage, answer); if (chat.title === '新对话') chat.title = prompt.slice(0, 30); $('input').value = ''; state.busy = true; setError(''); renderHistory(); const answerNode = renderMessages(true); renderModel({})
      try {
        let mcpContext = []
        try { const context = await fetch(SITE + '/chat/local-context', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) }); if (context.ok) mcpContext = (await context.json()).records || [] } catch { /* MCP is optional for general questions. */ }
        const contextText = mcpContext.length ? `\n\n以下为投资 MCP 返回的事实数据，只引用明确存在的内容：\n${JSON.stringify(mcpContext)}` : ''
        const history = chat.messages.slice(0, -2).slice(-8).map(({ role, content }) => ({ role, content }))
        const response = await fetch('http://127.0.0.1:8001/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' }, body: JSON.stringify({ model: 'DeepSeek-R1-Distill-Qwen-1.5B', stream: true, max_tokens: 512, messages: [{ role: 'system', content: OUTPUT_RULES + contextText }, ...history, { role: 'user', content: prompt }] }) })
        if (!response.ok || !response.body) throw new Error('本地模型服务请求失败。')
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ''; let output = ''
        while (true) {
          const part = await reader.read(); if (part.done) break
          buffer += decoder.decode(part.value, { stream: true }); const frames = buffer.split('\n\n'); buffer = frames.pop() || ''
          for (const frame of frames) {
            const line = frame.split('\n').find((item) => item.startsWith('data: ')); if (!line || line === 'data: [DONE]') continue
            const data = JSON.parse(line.slice(6)); if (data.error?.message) throw new Error(data.error.message)
            const delta = data.choices?.[0]?.delta || {}; output += delta.content || ''
            answer.content = output || '正在生成回复…'; updateMessageNode(answerNode, answer); scrollBottom(false)
          }
        }
        answer.content = normalizeAnswer(output); delete answer.pending; updateMessageNode(answerNode, answer, true); renderModel({ running: true }); persist()
      } catch (error) {
        chat.messages = chat.messages.filter((message) => message !== answer)
        setError(error instanceof Error ? error.message : '本地模型请求失败。'); renderModel({ running: false })
      } finally { state.busy = false; renderGpu(state.gpu); renderHistory(); renderMessages(false); persist(); $('input').focus() }
    }
    $('newChat').addEventListener('click', () => { if (!state.busy) createChat() })
    $('installModel').addEventListener('click', installModel)
    $('gpuToggle').addEventListener('change', toggleGpu)
    $('composer').addEventListener('submit', send)
    $('messages').addEventListener('scroll', () => { const panel = $('messages'); state.stickToBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight <= 32 })
    $('input').addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('composer').requestSubmit() } })
    $('back').addEventListener('click', () => { document.body.classList.add('leaving'); window.setTimeout(() => window.aiInvestmentDesktop?.openWebsite?.(), 180) })
    window.aiInvestmentDesktop?.onLocalModelStatus?.((model) => renderModel(model))
    state.chats = safeChats(); if (!state.chats.length) createChat(false); state.activeId = state.chats[0]?.id || null; renderHistory(); renderMessages(true)
    document.body.classList.add('ready'); renderModel({}); void checkHealth()
  </script>
</body>
